          $startTime = Get-Date
          Write-Host ">>> Start parallel building Python wheels... (Start time: $($startTime.ToString('yyyy-MM-dd HH:mm:ss')))"

          # Define Python versions to build wheels for
          $versions = @('3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11')

          # Build wheels for each Python version in parallel using ForEach-Object -Parallel
          $versions | ForEach-Object -Parallel {
              $v = $_

              # Find the Python interpreter using uv
              $interp = & uv python find $v 2>$null
