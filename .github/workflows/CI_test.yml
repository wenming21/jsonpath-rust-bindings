            echo "PY38=$(uv python find --python-arch i686 3.8)"
            echo "PY39=$(uv python find --python-arch i686 3.9)"
            echo "PY310=$(uv python find --python-arch i686 3.10)"
            echo "PY311=$(uv python find --python-arch i686 3.11)"
            echo "PY312=$(uv python find --python-arch i686 3.12)"
            echo "PY313=$(uv python find --python-arch i686 3.13)"
            echo "PY314=$(uv python find --python-arch i686 3.14)"
            echo "PY315=$(uv python find --python-arch i686 3.15)"
          } >> "$GITHUB_ENV"

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: x86
          args: |
            --release
            --out target/wheels
            -i ${{ env.PY38 }} ${{ env.PY39 }} ${{ env.PY310 }} ${{ env.PY311 }} ${{ env.PY312 }} ${{ env.PY313 }} ${{ env.PY314 }} ${{ env.PY315 }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86
          path: target/wheels

  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v7

      - name: sccache cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-windows-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-windows-arm64-

      - name: Set sccache env
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-pc-windows-msvc
          args: |
            --release
            --out target/wheels
            -i python3.11 python3.12 python3.13 python3.14 python3.15
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
