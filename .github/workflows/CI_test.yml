name: CI_test

on:
  push:
    branches:
      - main
      - master
      - dev1
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build Jobs
  # These jobs will build the wheels for all Python versions and upload them as artifacts.
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: sccache cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-windows-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-windows-x64-

      - name: Set sccache env
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6

      - name: Install Python versions with UV
        shell: bash
        run: uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15 pypy3.11

      - name: Set Python paths
        shell: bash
        run: |
          {
            echo "PY38=$(uv python find 3.8)"
            echo "PY39=$(uv python find 3.9)"
            echo "PY310=$(uv python find 3.10)"
            echo "PY311=$(uv python find 3.11)"
            echo "PY312=$(uv python find 3.12)"
            echo "PY313=$(uv python find 3.13)"
            echo "PY314=$(uv python find 3.14)"
            echo "PY315=$(uv python find 3.15)"
            echo "PYPY311=$(uv python find pypy3.11)"
          } >> "$GITHUB_ENV"

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: |
            --release
            --out target/wheels
            -i ${{ env.PY38 }} ${{ env.PY39 }} ${{ env.PY310 }} ${{ env.PY311 }} ${{ env.PY312 }} ${{ env.PY313 }} ${{ env.PY314 }} ${{ env.PY315 }} ${{ env.PYPY311 }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: target/wheels

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: sccache cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-windows-x86-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-windows-x86-

      - name: Set sccache env
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"

      - name: Setup UV
        uses: astral-sh/setup-uv@v6

      - name: Install Python versions with UV
        shell: bash
        run: uv python install --python-arch i686 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15

      - name: Set Python paths
        shell: bash
        run: |
