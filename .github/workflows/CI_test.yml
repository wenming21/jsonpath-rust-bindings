# This file is autogenerated by maturin>=v1.10.0,<2.0


name: CI_test

on:
  push:
    branches:
      - main
      - master
      - dev1
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build Jobs
  # These jobs will build the wheels for all Python versions and upload them as artifacts.
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python3.8 and multiple PyPy version
        run: uv python install 3.8 pypy3.11

      # - name: Build wheels for all Python versions
      #   uses: PyO3/maturin-action@v1.51.0
      #   with:
      #     target: x64
      #     args: |
      #       --release
      #       --out target/wheels
      #       -i python3.8 python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15
      #       -i pypy3.11

          # sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build wheels for all Python versions
        shell: bash
        run: |
          set -e
          for v in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15 pypy3.11; do
            interp=$(uv python find $v)

            uvx maturin build --release --interpreter "$interp" \
              --target-dir "target/$v" > "build-$v.log" 2>&1 &
          done
          wait

          mkdir -p target/wheels
          for v in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15 pypy3.11; do
            cp "target/$v/wheels"/*.whl target/wheels/ 2>/dev/null || true
          done
          ls target/wheels/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: target/wheels

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python3.8
        run: uv python install cpython-3.8-windows-i686-none

        # with:
        #   python-version: 3.8
        #   architecture: x86
        #   allow-prereleases: true

      # - name: Build wheels for all Python versions
      #   uses: PyO3/maturin-action@v1.51.0
      #   with:
      #     target: x86
      #     args: |
      #       --release
      #       --out target/wheels
      #       -i python3.8 python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15
      #     sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build wheels for all Python versions
        shell: bash
        run: |
          set -e
          for v in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            interp=$(uv python find $v)

            uvx maturin build --release --interpreter "$interp" \
              --target-dir "target/$v" > "build-$v.log" 2>&1 &
          done
          wait

          mkdir -p target/wheels
          for v in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            cp "target/$v/wheels"/*.whl target/wheels/ 2>/dev/null || true
          done
          ls target/wheels/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86
          path: target/wheels

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: aarch64-pc-windows-msvc
          args: |
            --release
            --out target/wheels
            -i python3.11 python3.12 python3.13 python3.14 python3.15
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-arm64
          path: target/wheels


  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out target/wheels
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: target/wheels

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'}}
    needs: [windows-x64, windows-x86, windows-arm64, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
