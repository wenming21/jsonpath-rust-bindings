name: CI_test

on:
  push:
    branches:
      - main
      - master
      - dev1
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build Jobs
  # These jobs will build the wheels for all Python versions and upload them as artifacts.
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install all Python versions
        run: uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15 pypy3.11

      - name: Build wheels for all Python versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:RUSTC_WRAPPER = 'sccache'

          $startTime = Get-Date
          $versions = @('3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11')

          # 先用一个版本串行预热缓存
          $first = & uv python find $versions[0]
          Write-Host ">>> 预热编译缓存 (Python $($versions[0])) ..."
          & uvx maturin build --release --interpreter $first --out target/wheels --target-dir "target/$($versions[0])" *> "build-$($versions[0]).log"
          if ($LASTEXITCODE -ne 0) { throw "预热构建失败，退出码 $LASTEXITCODE" }

          # 其余版本并行
          $rest = $versions[1..($versions.Count - 1)]
          $rest | ForEach-Object -Parallel {
              $v = $_
              $interp = & uv python find $v 2>$null
              if ($LASTEXITCODE -eq 0 -and $interp) {
                  Write-Host ">>> Launching Python $v build..."
                  & uvx maturin build --release --interpreter $interp --out target/wheels --target-dir "target/$v" *> "build-$v.log"
              }
          } -ThrottleLimit ($rest.Count * 2)   # 限流值 >= 任务数，等同全部同时启动

          # -Parallel 在所有线程结束后才返回，无需额外 wait

          $duration = (New-TimeSpan -Start $startTime -End (Get-Date)).TotalSeconds
          Write-Host ">>> All build tasks completed. Total time: $duration seconds"
          Write-Host ">>> Built artifacts:"
          Get-ChildItem "target/wheels/" | ForEach-Object { $_.Name }

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: target/wheels

