name: CodSpeed

on:
  push:
    branches:
      - main
      - master
      - dev1
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      # Keep debug symbols in the extension module so CodSpeed can
      # resolve Rust frames in flamegraphs.
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Build extension and install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -U maturin pytest pytest-codspeed
          uv run maturin develop --release

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest tests/test_benchmarks.py --codspeed
